volumes:
  rabbitmq_data:
    name: esd_rabbitmq_data

networks:
  esd-net:
    driver: bridge
    name: esd-net

services:

  ####################################
  # RabbitMQ: The messaging broker   
  ####################################
  rabbitmq:
    image: rabbitmq:3-management
    hostname: esd-rabbit
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes: 
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - esd-net

  rabbitmq-setup:
    image: python:3.11-slim
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"
    working_dir: /app
    volumes:
      - ./amqp_setup.py:/app/amqp_setup.py:ro
    environment:
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
    command: /bin/sh -c "pip install --no-cache-dir pika && python amqp_setup.py"
    networks:
      - esd-net