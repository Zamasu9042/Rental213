# ─── docker-compose.backend.yml ───────────────────────────────────────────────
# Starts second. All services wait for infra to be healthy.
# Run standalone:  docker compose -f infra/docker-compose.infra.yml \
#                                 -f backend/docker-compose.backend.yml up
#
# FIXES applied:
#   Issue 6 — worker-initiate-payment now has depends_on guards for
#             rental-service, payment-service, and camunda-proxy so it
#             doesn't attempt its first job against services that aren't ready.
#
#   Issue 7 — notification-service now loads ../.env via env_file so that
#             TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM_NUMBER
#             and ACCOUNT_SERVICE_URL are present in the container.
#             Previously those vars were never injected and SMS was silently skipped.
#
#   Issue 8 — camunda-proxy now receives PAYMENT_SERVICE_URL explicitly so the
#             webhook forwarding target is unambiguous and not left to the hardcoded
#             fallback inside camunda_proxy.js.
#
#   Also added — payment-service was entirely absent from this file (it only
#             existed in the standalone backend/compose.yaml). Without it the
#             worker-initiate-payment and the webhook handler had nothing to talk to.

networks:
  esd-net:
    external: true   # created by infra compose

volumes:
  equipment_images: { name: esd_equipment_images }
  damage_photos:    { name: esd_damage_photos }

services:

  # ── Core microservices ─────────────────────────────────────────────────────

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://account:account_pass@account-db:3306/account_db
    ports:
      - "8006:8000"
    depends_on:
      account-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [esd-net]

  equipment-service:
    build:
      context: ./equipment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://equipment:equipment_pass@equipment-db:3306/equipment_db
    ports:
      - "8001:8000"
    volumes:
      - equipment_images:/app/images
    depends_on:
      equipment-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [esd-net]

  rental-service:
    build:
      context: ./rental-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://rental:rental_pass@rental-db:3306/rental_db
      EQUIPMENT_SERVICE_URL: http://equipment-service:8000
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_EXCHANGE: rental_topic
    ports:
      - "8002:8000"
    depends_on:
      rental-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      equipment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [esd-net]

  reputation-service:
    build:
      context: ./reputation-microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://reputation:reputation_pass@reputation-db:3306/reputation_db
    ports:
      - "8003:8000"
    depends_on:
      reputation-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [esd-net]

  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
    ports:
      - "8005:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [esd-net]

  damage-claim-service:
    build:
      context: ./damage-claim-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://damage:damage_pass@damage-db:3306/damage_claims_db
      VISION_SERVICE_URL: http://vision-service:8000
      DAMAGE_PUBLIC_BASE: http://damage-claim-service:8000
    volumes:
      - damage_photos:/data/photos
    ports:
      - "8004:8000"
    depends_on:
      damage-db:
        condition: service_healthy
      vision-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [esd-net]

  # ISSUE 7 FIX: added env_file so TWILIO_* and ACCOUNT_SERVICE_URL are injected.
  # Previously the container had no Twilio credentials and _send_sms() silently
  # skipped every notification.
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      # Explicit env vars override anything from env_file for these keys,
      # ensuring the service always connects to the right internal hosts.
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_EXCHANGE: rental_topic
      NOTIFICATION_QUEUE: notification_SendPaymentConfirmation
      ACCOUNT_SERVICE_URL: http://account-service:8000
    ports:
      - "8007:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      amqp-setup:
        condition: service_completed_successfully
      account-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [esd-net]

  # ── Payment service (was missing from this file entirely) ─────────────────
  # This is the real payment microservice that creates Stripe Checkout sessions
  # and handles the webhook finalization. It was only in backend/compose.yaml
  # (the standalone monolith compose) and never started via the root compose.

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: mysql+pymysql://payment:payment_pass@payment-db:3306/payment_db
      RENTAL_SERVICE_URL: http://rental-service:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_EXCHANGE: rental_topic
    ports:
      - "8009:8000"
    depends_on:
      payment-db:
        condition: service_healthy
      rental-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [esd-net]

  # ── Stripe payment wrapper ─────────────────────────────────────────────────

  payment-wrapper:
    build:
      context: ./payment-wrapper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    ports:
      - "8008:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [esd-net]

  # ── Camunda orchestration proxy ────────────────────────────────────────────
  # Handles: POST /api/rentals → starts Camunda workflow
  #          GET  /api/rentals/:key/stripe-url → frontend polling
  #          POST /webhook/stripe → Stripe webhook → forwards to payment-service

  # ISSUE 8 FIX: added PAYMENT_SERVICE_URL so webhook forwarding is explicit.
  # Previously it fell back to the hardcoded default inside camunda_proxy.js.
  camunda-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "3001"
      CAMUNDA_CLIENT_ID: ${CAMUNDA_CLIENT_ID}
      CAMUNDA_CLIENT_SECRET: ${CAMUNDA_CLIENT_SECRET}
      CAMUNDA_CLUSTER_ID: ${CAMUNDA_CLUSTER_ID}
      CAMUNDA_REGION: ${CAMUNDA_REGION:-sin-2}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      RENTAL_SERVICE_URL: http://rental-service:8000
      # ISSUE 8 FIX: explicitly wire proxy → payment-service for webhook forwarding
      PAYMENT_SERVICE_URL: http://payment-service:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3001:3001"
    depends_on:
      rental-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks: [esd-net]

  # ── Camunda Workers ────────────────────────────────────────────────────────

  worker-account:
    build:
      context: ./workers
      dockerfile: Dockerfile.workers
    command: python worker_account.py
    restart: unless-stopped
    environment:
      CAMUNDA_CLIENT_ID: ${CAMUNDA_CLIENT_ID}
      CAMUNDA_CLIENT_SECRET: ${CAMUNDA_CLIENT_SECRET}
      CAMUNDA_CLUSTER_ID: ${CAMUNDA_CLUSTER_ID}
      CAMUNDA_REGION: ${CAMUNDA_REGION:-sin-2}
      ACCOUNT_SERVICE_URL: http://account-service:8000
    depends_on:
      account-service:
        condition: service_healthy
    networks: [esd-net]

  worker-equipment:
    build:
      context: ./workers
      dockerfile: Dockerfile.workers
    command: python worker_equipment.py
    restart: unless-stopped
    environment:
      CAMUNDA_CLIENT_ID: ${CAMUNDA_CLIENT_ID}
      CAMUNDA_CLIENT_SECRET: ${CAMUNDA_CLIENT_SECRET}
      CAMUNDA_CLUSTER_ID: ${CAMUNDA_CLUSTER_ID}
      CAMUNDA_REGION: ${CAMUNDA_REGION:-sin-2}
      EQUIPMENT_SERVICE_URL: http://equipment-service:8000
    depends_on:
      equipment-service:
        condition: service_healthy
    networks: [esd-net]

  # ISSUE 6 FIX: added depends_on for rental-service, payment-service, and
  # camunda-proxy. Previously this worker started immediately and its first
  # Camunda job would fire HTTP calls into services that weren't ready yet.
  # restart: unless-stopped catches transient failures but the clean fix is
  # to not start the worker until its dependencies are actually up.
  worker-initiate-payment:
    build:
      context: ./workers
      dockerfile: Dockerfile.workers
    command: python worker_initiate_payment.py
    restart: unless-stopped
    environment:
      CAMUNDA_CLIENT_ID: ${CAMUNDA_CLIENT_ID}
      CAMUNDA_CLIENT_SECRET: ${CAMUNDA_CLIENT_SECRET}
      CAMUNDA_CLUSTER_ID: ${CAMUNDA_CLUSTER_ID}
      CAMUNDA_REGION: ${CAMUNDA_REGION:-sin-2}
      RENTAL_SERVICE_URL: http://rental-service:8000
      # ISSUE 6 (related): correct target is payment-service, not payment-wrapper
      PAYMENT_SERVICE_URL: http://payment-service:8000
      PROXY_URL: http://camunda-proxy:3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      rental-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      camunda-proxy:
        condition: service_started
    networks: [esd-net]

  worker-rabbitmq:
    build:
      context: ./workers
      dockerfile: Dockerfile.workers
    command: python worker_rabbitmq.py
    restart: unless-stopped
    environment:
      CAMUNDA_CLIENT_ID: ${CAMUNDA_CLIENT_ID}
      CAMUNDA_CLIENT_SECRET: ${CAMUNDA_CLIENT_SECRET}
      CAMUNDA_CLUSTER_ID: ${CAMUNDA_CLUSTER_ID}
      CAMUNDA_REGION: ${CAMUNDA_REGION:-sin-2}
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_EXCHANGE: rental_topic
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [esd-net]