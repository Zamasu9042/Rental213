volumes:
  equipment_mysql_data:
    name: esd_equipment_mysql_data
  rental_mysql_data:
    name: esd_rental_mysql_data
  reputation_mysql_data:
    name: esd_reputation_mysql_data
  rabbitmq_data:
    name: esd_rabbitmq_data
  damage_mysql_data:
    name: esd_damage_mysql_data
  damage_photos:
    name: esd_damage_photos
  equipment_images:
    name: esd_equipment_images
  payment_mysql_data:
    name: esd_payment_mysql_data

networks:
  esd-net:
    driver: bridge
    name: esd-net

services:
  equipment-db:
    image: mysql:8.0
    hostname: equipment-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: equipment_db
      MYSQL_USER: equipment
      MYSQL_PASSWORD: equipment_pass
      MYSQL_ROOT_PASSWORD: root_equipment
    volumes:
      - equipment_mysql_data:/var/lib/mysql
      - ./equipment-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./equipment-service/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_equipment"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - esd-net

  rental-db:
    image: mysql:8.0
    hostname: rental-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rental_db
      MYSQL_USER: rental
      MYSQL_PASSWORD: rental_pass
      MYSQL_ROOT_PASSWORD: root_rental
    volumes:
      - rental_mysql_data:/var/lib/mysql
      - ./rental-service/docker-init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./rental-service/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_rental"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - esd-net

  reputation-db:
    image: mysql:8.0
    hostname: reputation-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reputation_db
      MYSQL_USER: reputation
      MYSQL_PASSWORD: reputation_pass
      MYSQL_ROOT_PASSWORD: root_reputation
    volumes:
      - reputation_mysql_data:/var/lib/mysql
    ports:
      - "3309:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-proot_reputation",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - esd-net

  payment-db:
    image: mysql:8.0
    hostname: payment-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: payment_db
      MYSQL_USER: payment
      MYSQL_PASSWORD: payment_pass
      MYSQL_ROOT_PASSWORD: root_payment
    volumes:
      - payment_mysql_data:/var/lib/mysql
      - ./payment-service/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3312:3306"
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_payment"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - esd-net

  damage-db:
    image: mysql:8.0
    hostname: damage-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: damage_claims_db
      MYSQL_USER: damage
      MYSQL_PASSWORD: damage_pass
      MYSQL_ROOT_PASSWORD: root_damage
    volumes:
      - damage_mysql_data:/var/lib/mysql
      - ./damage-claim-service/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3311:3306"
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_damage"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - esd-net

  rabbitmq:
    image: rabbitmq:3-management
    hostname: esd-rabbit
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - esd-net

  amqp-setup:
    build:
      context: ./amqp-setup
      dockerfile: Dockerfile
    environment:
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_EXCHANGE: rental_topic
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    networks:
      - esd-net

  equipment-service:
    build:
      context: ./equipment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://equipment:equipment_pass@equipment-db:3306/equipment_db
    ports:
      - "8001:8000"
    volumes:
      - equipment_images:/app/images
    depends_on:
      equipment-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - esd-net

  rental-service:
    build:
      context: ./rental-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://rental:rental_pass@rental-db:3306/rental_db
      EQUIPMENT_SERVICE_URL: http://equipment-service:8000
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_EXCHANGE: rental_topic
    ports:
      - "8002:8000"
    depends_on:
      rental-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      equipment-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - esd-net

  reputation-service:
    build:
      context: ./reputation-microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://reputation:reputation_pass@reputation-db:3306/reputation_db
    ports:
      - "8003:8000"
    depends_on:
      reputation-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - esd-net

  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment: {}
    ports:
      - "8005:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - esd-net

  damage-claim-service:
    build:
      context: ./damage-claim-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://damage:damage_pass@damage-db:3306/damage_claims_db
      VISION_SERVICE_URL: http://vision-service:8000
    volumes:
      - damage_photos:/data/photos
    ports:
      - "8004:8000"
    depends_on:
      damage-db:
        condition: service_healthy
      vision-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - esd-net

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_EXCHANGE: rental_topic
      NOTIFICATION_QUEUE: notification_SendPaymentConfirmation
      KONG_URL: http://kong:8000
    ports:
      - "8007:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      amqp-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - esd-net

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: mysql+pymysql://payment:payment_pass@payment-db:3306/payment_db
      RENTAL_SERVICE_URL: http://rental-service:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_EXCHANGE: rental_topic
    ports:
      - "8009:8000"
    depends_on:
      payment-db:
        condition: service_healthy
      rental-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - esd-net

  payment-wrapper:
    build:
      context: ./payment-wrapper
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment: {}
    ports:
      - "8008:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - esd-net

  camunda-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: "3001"
      RENTAL_SERVICE_URL: http://rental-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      REPUTATION_SERVICE_URL: http://reputation-service:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_EXCHANGE: rental_topic
      DEMO_PHONE_NUMBER: ${DEMO_PHONE_NUMBER:-}
    ports:
      - "3001:3001"
    depends_on:
      rental-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      amqp-setup:
        condition: service_completed_successfully
    networks:
      - esd-net

  kong:
    image: kong:3.7
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_LOG_LEVEL: warn
    ports:
      - "8000:8000"
    volumes:
      - ./kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      - equipment-service
      - rental-service
      - payment-service
      - camunda-proxy
      - reputation-service
    networks:
      - esd-net
