services:
  kong:
    image: kong:3.7
    container_name: p2p-rental-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.local.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8002:8001"
    volumes:
      - ./kong.local.yml:/usr/local/kong/declarative/kong.local.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
