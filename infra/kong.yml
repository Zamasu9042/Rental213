_format_version: "3.0"
_transform: true

services:
  - name: equipment-service
    url: https://REPLACE-EQUIPMENT-SERVICE-URL
    routes:
      - name: equipment-route
        paths:
          - /api/equipment
        strip_path: false

  - name: rental-service
    url: https://REPLACE-RENTAL-SERVICE-URL
    routes:
      - name: rental-route
        paths:
          - /api/rentals
        strip_path: false

  - name: payment-service
    url: https://REPLACE-PAYMENT-SERVICE-URL
    routes:
      - name: payment-route
        paths:
          - /api/payments
        strip_path: false

  - name: reputation-service
    url: https://REPLACE-REPUTATION-SERVICE-URL
    routes:
      - name: reputation-route
        paths:
          - /api/reputation
        strip_path: false

  - name: damage-claims-service
    url: https://REPLACE-DAMAGE-CLAIMS-SERVICE-URL
    routes:
      - name: damage-claims-route
        paths:
          - /api/damage-claims
        strip_path: false

  - name: notification-service
    url: https://REPLACE-NOTIFICATION-SERVICE-URL
    routes:
      - name: notification-route
        paths:
          - /api/notify
        strip_path: false

  - name: profiles-service
    url: https://REPLACE-PROFILES-SERVICE-URL
    routes:
      - name: profiles-route
        paths:
          - /api/profiles
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - x-correlation-id
      exposed_headers:
        - x-correlation-id
      credentials: true
      max_age: 3600
