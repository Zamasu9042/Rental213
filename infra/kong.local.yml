_format_version: "3.0"
_transform: true

services:
  - name: local-reference-backend
    url: http://host.docker.internal:4000
    routes:
      - name: local-reference-backend-route
        paths:
          - /api
          - /health
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - x-correlation-id
      exposed_headers:
        - x-correlation-id
      credentials: true
      max_age: 3600
