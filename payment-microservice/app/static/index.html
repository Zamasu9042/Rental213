<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment</title>
  <script src="https://js.stripe.com/v3/"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sohne:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f6f9fc;
      --card: #ffffff;
      --border: #e3e8ee;
      --text: #1a1f36;
      --muted: #697386;
      --accent: #635bff;
      --accent-hover: #4b44e0;
      --success: #0a8a5e;
      --error: #df1b41;
      --radius: 8px;
      --shadow: 0 2px 5px 0 rgba(60,66,87,.08), 0 1px 1px 0 rgba(0,0,0,.12);
      --shadow-lg: 0 6px 24px 0 rgba(60,66,87,.12), 0 2px 4px 0 rgba(0,0,0,.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }

    .card-header {
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg { width: 18px; height: 18px; fill: white; }

    .brand-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .amount-display {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .currency {
      font-size: 22px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 4px;
    }

    .amount {
      font-size: 40px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -1px;
      line-height: 1;
    }

    .amount-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }

    .card-body { padding: 24px 28px 28px; }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: 0.1px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      color: var(--text);
      background: white;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,91,255,0.15);
    }

    input::placeholder { color: #b0b8c4; }

    .stripe-element-wrapper {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: white;
    }

    .stripe-element-wrapper.focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,91,255,0.15);
    }

    .stripe-element-wrapper.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(223,27,65,0.1);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .pay-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      letter-spacing: 0.1px;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
    }

    .pay-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(99,91,255,0.35);
    }

    .pay-btn:active:not(:disabled) { transform: scale(0.99); }

    .pay-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .pay-btn .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    .pay-btn.loading .btn-text { display: none; }
    .pay-btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      color: var(--error);
      font-size: 13px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 18px;
    }

    .success-state {
      text-align: center;
      padding: 40px 28px;
      display: none;
    }

    .success-icon {
      width: 56px;
      height: 56px;
      background: #ecfdf5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .success-icon svg { width: 28px; height: 28px; stroke: var(--success); }

    .success-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .success-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    .powered {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 12px;
      color: #aab7c4;
    }

    .powered svg { width: 34px; height: 14px; fill: #aab7c4; }

    .amount-input-row {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: white;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .amount-input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,91,255,0.15);
    }

    .amount-prefix {
      padding: 10px 12px;
      font-size: 15px;
      color: var(--muted);
      background: #f8fafc;
      border-right: 1px solid var(--border);
      user-select: none;
    }

    .amount-input-row input {
      border: none;
      border-radius: 0;
      flex: 1;
      padding: 10px 12px;
    }

    .amount-input-row input:focus {
      border: none;
      box-shadow: none;
    }
  </style>
</head>
<body>

<div class="card">
  <div id="payment-form-section">
    <div class="card-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <span class="brand-name">Payment Demo</span>
      </div>
      <div class="amount-display">
        <span class="currency">USD</span>
        <span class="amount" id="display-amount">20.00</span>
      </div>
      <div class="amount-desc">Test payment · Sandbox mode</div>
    </div>

    <div class="card-body">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
      </div>

      <div class="field">
        <label>Name on card</label>
        <input type="text" id="name" placeholder="Jane Smith" autocomplete="cc-name"/>
      </div>

      <div class="field">
        <label>Amount (USD)</label>
        <div class="amount-input-row">
          <span class="amount-prefix">$</span>
          <input type="text" id="amount-input" value="20.00" placeholder="0.00" inputmode="decimal"/>
        </div>
      </div>

      <div class="divider">Card details</div>

      <div class="field">
        <label>Card number</label>
        <div class="stripe-element-wrapper" id="card-number-wrapper">
          <div id="card-number"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Expiry</label>
          <div class="stripe-element-wrapper" id="card-expiry-wrapper">
            <div id="card-expiry"></div>
          </div>
        </div>
        <div class="field">
          <label>CVC</label>
          <div class="stripe-element-wrapper" id="card-cvc-wrapper">
            <div id="card-cvc"></div>
          </div>
        </div>
      </div>

      <div class="error-msg" id="error-msg"></div>

      <button class="pay-btn" id="pay-btn" onclick="handlePay()">
        <span class="btn-text">Pay $<span id="btn-amount">20.00</span></span>
        <div class="spinner"></div>
      </button>

      <div class="powered">
        Powered by
        <svg viewBox="0 0 60 25" xmlns="http://www.w3.org/2000/svg"><path d="M59.64 14.28h-8.06c.19 1.93 1.6 2.55 3.2 2.55 1.64 0 2.96-.37 4.05-.95v3.32a8.33 8.33 0 0 1-4.56 1.1c-4.01 0-6.83-2.5-6.83-7.48 0-4.19 2.39-7.52 6.3-7.52 3.92 0 5.96 3.28 5.96 7.5 0 .4-.04 1.26-.06 1.48zm-5.92-5.62c-1.03 0-2.17.73-2.17 2.58h4.25c0-1.85-1.07-2.58-2.08-2.58zM40.95 20.3c-1.44 0-2.32-.6-2.9-1.04l-.02 4.63-4.12.87V5.57h3.76l.08 1.02a4.7 4.7 0 0 1 3.23-1.29c2.9 0 5.62 2.6 5.62 7.4 0 5.23-2.7 7.6-5.65 7.6zM40 8.95c-.95 0-1.54.34-1.97.81l.03 6.12c.4.44.98.78 1.94.78 1.52 0 2.54-1.65 2.54-3.87 0-2.15-1.05-3.84-2.54-3.84zM28.24 5.57h4.13v14.44h-4.13V5.57zm0-4.7L32.37 0v3.36l-4.13.88V.88zm-4.32 9.35v9.79H19.8V5.57h3.7l.12 1.22c1-1.77 2.96-1.49 3.54-1.27v3.89c-.52-.17-2.29-.43-3.24.82zm-8.85-4.65c1.25 0 2.18.4 2.77.84V5.57h4.12v14.44h-3.94l-.14-1.01a4.64 4.64 0 0 1-3.13 1.28c-2.89 0-5.59-2.57-5.59-7.38 0-5.22 2.7-7.63 5.91-7.63zm.95 3.44c-1.54 0-2.54 1.7-2.54 3.85 0 2.22 1 3.88 2.54 3.88.95 0 1.54-.34 1.97-.81l-.02-6.1c-.4-.45-.98-.82-1.95-.82zm-9.09-3.44C5.45 5.7 3.7 7.37 3.7 9.81v10.2H7.81V9.9c0-.92.45-1.45 1.33-1.45.6 0 1.12.3 1.56.77V5.8a4.02 4.02 0 0 0-2.77-1.09z"/></svg>
      </div>
    </div>
  </div>

  <div class="success-state" id="success-state">
    <div class="success-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
    <div class="success-title">Payment successful</div>
    <div class="success-sub">Your test payment was processed.<br/>Check your Stripe dashboard to confirm.</div>
  </div>
</div>

<script>
  let stripe, cardNumber, cardExpiry, cardCvc;

  const elementStyle = {
    base: {
      fontSize: '15px',
      color: '#1a1f36',
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
      fontSmoothing: 'antialiased',
      '::placeholder': { color: '#b0b8c4' },
    },
    invalid: { color: '#df1b41' }
  };

  async function init() {
    const res = await fetch('/api/payments/config');
    const { publishableKey } = await res.json();
    stripe = Stripe(publishableKey);

    const elements = stripe.elements();

    cardNumber = elements.create('cardNumber', { style: elementStyle, showIcon: true });
    cardExpiry = elements.create('cardExpiry', { style: elementStyle });
    cardCvc    = elements.create('cardCvc',    { style: elementStyle });

    cardNumber.mount('#card-number');
    cardExpiry.mount('#card-expiry');
    cardCvc.mount('#card-cvc');

    [
      [cardNumber, 'card-number-wrapper'],
      [cardExpiry, 'card-expiry-wrapper'],
      [cardCvc,    'card-cvc-wrapper'],
    ].forEach(([el, id]) => {
      el.on('focus', () => document.getElementById(id).classList.add('focused'));
      el.on('blur',  () => document.getElementById(id).classList.remove('focused'));
      el.on('change', e => {
        const w = document.getElementById(id);
        w.classList.toggle('error', !!e.error);
        if (e.error) showError(e.error.message);
        else clearError();
      });
    });
  }

  document.getElementById('amount-input').addEventListener('input', function() {
    const val = parseFloat(this.value) || 0;
    const fmt = val.toFixed(2);
    document.getElementById('display-amount').textContent = fmt;
    document.getElementById('btn-amount').textContent = fmt;
  });

  async function handlePay() {
    const btn = document.getElementById('pay-btn');
    const amountStr = document.getElementById('amount-input').value;
    const amount = Math.round(parseFloat(amountStr) * 100);
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();

    // Validation
    if (!name) return showError('Please enter the name on your card.');
    if (name.length < 2) return showError('Please enter a valid name.');
    if (!email) return showError('Please enter your email.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Please enter a valid email address.');
    if (!amount || amount <= 0) return showError('Please enter a valid amount.');

    btn.disabled = true;
    btn.classList.add('loading');
    clearError();

    try {
      const res = await fetch('/api/payments/create-intent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount, currency: 'usd' })
      });
      const { client_secret, error } = await res.json();
      if (error) throw new Error(error);

      const name  = document.getElementById('name').value;
      const email = document.getElementById('email').value;

      const result = await stripe.confirmCardPayment(client_secret, {
        payment_method: {
          card: cardNumber,
          billing_details: { name, email }
        }
      });

      if (result.error) throw new Error(result.error.message);

      document.getElementById('payment-form-section').style.display = 'none';
      document.getElementById('success-state').style.display = 'block';

    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  function showError(msg) {
    document.getElementById('error-msg').textContent = msg;
  }

  function clearError() {
    document.getElementById('error-msg').textContent = '';
  }

  init();
</script>
</body>
</html>
